[project]
name = "enterprise-alert-agent"
version = "0.2.0"
description = "Enterprise RAG and alert agent starter"
readme = "README.md"
requires-python = ">=3.11"
packages = ["app"]      # 关键配置：只识别app作为主包，忽略data目录
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "chromadb>=0.5.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.1.0",
    "openai-agents",
    "langsmith",
    "flashrank>=0.2.10",
    "pymysql>=1.2.0",
    "langgraph>=0.2.50",          # InMemoryStore所在包，≥0.2.20才有store.memory
    "langchain>=0.3.0",            # create_agent依赖主包
    "langchain-core>=0.3.50",      # @tool、ToolRuntime在这里
    "langchain-community>=0.3.0",  # 社区工具兼容包
    "langchain-openai>=1.2.2",
    "langgraph-checkpoint-postgres>=3.1.0",
    "deprecated>=1.3.1",
    "types-deprecated>=1.3.1.20260520",
    "redis>=5.0.0",
    "psycopg[binary]>=3.1.0",
    "slowapi>=0.1.10",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "pymysql.*"
ignore_missing_imports = true
[tool.ruff.lint]
ignore = ["B008"]  # FastAPI Depends() pattern
