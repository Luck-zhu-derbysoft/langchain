apiVersion: v1
kind: Secret
metadata:
  name: enterprise-alert-agent-secrets
  namespace: enterprise-alert
type: Opaque
stringData:
  DASHSCOPE_API_KEY: replace-me
  ADMIN_JWT_SECRET: replace-me-with-at-least-32-random-characters
  # 轮换时先把旧值填到这里，新密钥写入 ADMIN_JWT_SECRET，滚动重启；
  # 等待旧 token 最大 TTL（ADMIN_JWT_EXP_MINUTES）过去后再清空此项
  ADMIN_JWT_SECRET_PREVIOUS: ""
  MYSQL_PASSWORD: replace-me
  REDIS_PASSWORD: replace-me
  PG_PASSWORD: replace-me
  MCP_SERVICE_URL: https://replace-me/mcp
  MCP_API_KEY: replace-me
  LANGSMITH_API_KEY: replace-me
