apiVersion: apps/v1
kind: Deployment
metadata:
  name: enterprise-alert-agent
  namespace: enterprise-alert
  labels:
    app.kubernetes.io/name: enterprise-alert-agent
    app.kubernetes.io/component: api
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: enterprise-alert-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: enterprise-alert-agent
        app.kubernetes.io/component: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: app
          image: ghcr.io/luck-zhu-derbysoft/enterprise-alert-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: enterprise-alert-agent-config
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enterprise-alert-agent-secrets
                  key: REDIS_PASSWORD
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enterprise-alert-agent-secrets
                  key: PG_PASSWORD
            - name: DASHSCOPE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: enterprise-alert-agent-secrets
                  key: DASHSCOPE_API_KEY
            - name: ADMIN_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: enterprise-alert-agent-secrets
                  key: ADMIN_JWT_SECRET
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: enterprise-alert-agent-secrets
                  key: MYSQL_PASSWORD
            - name: MCP_SERVICE_URL
              valueFrom:
                secretKeyRef:
                  name: enterprise-alert-agent-secrets
                  key: MCP_SERVICE_URL
            - name: MCP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: enterprise-alert-agent-secrets
                  key: MCP_API_KEY
            - name: LANGSMITH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: enterprise-alert-agent-secrets
                  key: LANGSMITH_API_KEY
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: enterprise-alert-agent-data
